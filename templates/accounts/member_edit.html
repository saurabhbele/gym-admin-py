{% extends 'base.html' %}

{% block title %}Edit {{ member.full_name }}{% endblock %}

{% block content %}
    <h1 class="mb-4">Edit Profile: {{ member.full_name }}</h1>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <!-- Render the form fields -->
                {{ form.as_p }}

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{% url 'member_detail' user_id=member.user.id %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
