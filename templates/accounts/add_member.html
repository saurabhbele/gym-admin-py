{% extends 'base.html' %}

{% block title %}Add New Member{% endblock %}

{% block content %}
    <h1 class="mb-4">Add New Member</h1>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <h5 class="mt-3">User Account Details</h5>
                {{ user_form.as_p }}

                <h5 class="mt-4">Member Profile Details</h5>
                {{ profile_form.as_p }}

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Add Member</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
